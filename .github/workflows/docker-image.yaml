name: Hospital CI/CD

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: sibasish6976/testing-minikube-repo

jobs:

  # ============================================================
  # CI - BUILD AND PUSH DOCKER IMAGE
  # ============================================================
  build-and-push:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        shell: bash
        run: |
          echo "=========================================="
          echo "BUILDING DOCKER IMAGE"
          echo "=========================================="

          docker build \
            -t "${IMAGE_NAME}:latest" \
            .

      - name: Push Docker image
        shell: bash
        run: |
          echo "=========================================="
          echo "PUSHING DOCKER IMAGE"
          echo "=========================================="

          docker push "${IMAGE_NAME}:latest"


  # ============================================================
  # CD - DEPLOY TO MACBOOK MINIKUBE
  # ============================================================
  deploy:
    needs: build-and-push

    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - mac-minikube

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # VERIFY MINIKUBE
      # --------------------------------------------------------
      - name: Verify Minikube
        shell: bash
        run: |
          echo "=========================================="
          echo "MINIKUBE STATUS"
          echo "=========================================="

          minikube status


      # --------------------------------------------------------
      # VERIFY KUBERNETES
      # --------------------------------------------------------
      - name: Verify Kubernetes
        shell: bash
        run: |
          echo "=========================================="
          echo "KUBERNETES STATUS"
          echo "=========================================="

          kubectl config use-context minikube
          kubectl get nodes


      # --------------------------------------------------------
      # CREATE / UPDATE NAMESPACE
      # --------------------------------------------------------
      - name: Deploy Namespace
        shell: bash
        run: |
          kubectl apply \
            -f hospital-k8s/namespace.yaml


      # --------------------------------------------------------
      # DEPLOY MONGODB
      # --------------------------------------------------------
      - name: Deploy MongoDB
        shell: bash
        run: |
          echo "=========================================="
          echo "DEPLOYING MONGODB"
          echo "=========================================="

          kubectl apply \
            -f hospital-k8s/mongodb/pvc.yaml

          kubectl apply \
            -f hospital-k8s/mongodb/deployment.yaml

          kubectl apply \
            -f hospital-k8s/mongodb/service.yaml


      # --------------------------------------------------------
      # WAIT FOR MONGODB
      # --------------------------------------------------------
      - name: Wait for MongoDB
        shell: bash
        run: |
          kubectl rollout status \
            deployment/mongodb \
            -n hospital \
            --timeout=180s


      # --------------------------------------------------------
      # DEPLOY API CONFIGURATION
      # --------------------------------------------------------
      - name: Deploy Hospital API Configuration
        shell: bash
        run: |
          kubectl apply \
            -f hospital-k8s/hospital-api/configmap.yaml

          kubectl apply \
            -f hospital-k8s/hospital-api/service.yaml


      # --------------------------------------------------------
      # REMOVE EXISTING API DEPLOYMENT
      # --------------------------------------------------------
      - name: Remove existing Hospital API deployment
        shell: bash
        run: |
          kubectl delete deployment hospital-api \
            -n hospital \
            --ignore-not-found=true

          echo "Existing Hospital API deployment removed."


      # --------------------------------------------------------
      # DEPLOY API
      # --------------------------------------------------------
      - name: Deploy Hospital API
        shell: bash
        run: |
          kubectl apply \
            -f hospital-k8s/hospital-api/deployment.yaml


      # --------------------------------------------------------
      # WAIT FOR API
      # --------------------------------------------------------
      - name: Wait for Hospital API
        shell: bash
        run: |
          kubectl rollout status \
            deployment/hospital-api \
            -n hospital \
            --timeout=180s


      # --------------------------------------------------------
      # VERIFY DEPLOYMENT
      # --------------------------------------------------------
      - name: Verify deployment
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "KUBERNETES DEPLOYMENT SUCCESSFUL"
          echo "=========================================="

          echo ""
          echo "Minikube:"
          minikube status

          echo ""
          echo "Nodes:"
          kubectl get nodes

          echo ""
          echo "Hospital Namespace:"
          kubectl get all -n hospital

          echo ""
          echo "Pods:"
          kubectl get pods -n hospital

          echo ""
          echo "Deployments:"
          kubectl get deployments -n hospital

          echo ""
          echo "Services:"
          kubectl get services -n hospital

          echo ""
          echo "Hospital API Image:"
          kubectl get deployment hospital-api \
            -n hospital \
            -o jsonpath="{.spec.template.spec.containers[0].image}"

          echo ""
          echo ""
          echo "=========================================="
          echo "DEPLOYMENT VERIFICATION COMPLETE"
          echo "=========================================="