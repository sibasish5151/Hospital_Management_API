apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  namespace: hospital

spec:
  restartPolicy: Always

  containers:
    - name: load-generator
      image: busybox:1.36

      command:
        - /bin/sh
        - -c
        - |
          echo "Starting load generator..."

          for i in $(seq 1 20); do
            (
              while true; do
                wget -q -O- http://hospital-api:5000/api/inventory/full > /dev/null
              done
            ) &
          done

          wait