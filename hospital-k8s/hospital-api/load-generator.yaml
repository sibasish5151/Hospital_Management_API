apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  namespace: hospital

spec:
  containers:
    - name: load-generator
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - |
          while true; do
            wget -q -O- http://hospital-api:5000/api/inventory/full > /dev/null
          done