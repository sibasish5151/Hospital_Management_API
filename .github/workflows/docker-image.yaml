name: Hospital CI/CD

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: sibasish6976/testing-minikube-repo

jobs:

  # ============================================================
  # CI - BUILD AND PUSH DOCKER IMAGE
  # ============================================================
  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.image.outputs.tag }}

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # GENERATE IMMUTABLE IMAGE TAG
      # --------------------------------------------------------
      - name: Generate image tag
        id: image
        shell: bash
        run: |
          IMAGE_TAG="${GITHUB_SHA}"

          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "Docker Image"
          echo "=========================================="
          echo "${IMAGE_NAME}:${IMAGE_TAG}"

      # --------------------------------------------------------
      # LOGIN TO DOCKER HUB
      # --------------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------------------------------------------
      # BUILD DOCKER IMAGE
      # --------------------------------------------------------
      - name: Build Docker image
        shell: bash
        run: |
          docker build \
            -t "${IMAGE_NAME}:${{ steps.image.outputs.tag }}" \
            .

      # --------------------------------------------------------
      # PUSH DOCKER IMAGE
      # --------------------------------------------------------
      - name: Push Docker image
        shell: bash
        run: |
          docker push \
            "${IMAGE_NAME}:${{ steps.image.outputs.tag }}"


  # ============================================================
  # CD - DEPLOY TO MACBOOK MINIKUBE
  # ============================================================
  deploy:
    needs: build-and-push

    # IMPORTANT:
    # This ensures the deployment runs specifically on
    # your MacBook Air self-hosted runner.
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - mac-minikube

    env:
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}

    steps:

      # --------------------------------------------------------
      # CHECKOUT REPOSITORY
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # VERIFY MINIKUBE
      # --------------------------------------------------------
      - name: Verify Minikube
        shell: bash
        run: |
          echo "=========================================="
          echo "MINIKUBE STATUS"
          echo "=========================================="

          minikube status


      # --------------------------------------------------------
      # VERIFY KUBERNETES
      # --------------------------------------------------------
      - name: Verify Kubernetes
        shell: bash
        run: |
          echo "=========================================="
          echo "KUBERNETES STATUS"
          echo "=========================================="

          kubectl config use-context minikube

          kubectl get nodes


      # --------------------------------------------------------
      # DEPLOY NAMESPACE
      # --------------------------------------------------------
      - name: Deploy Hospital Namespace
        shell: bash
        run: |
          echo "Creating/updating hospital namespace..."

          kubectl apply \
            -f hospital-k8s/namespace.yaml


      # --------------------------------------------------------
      # DEPLOY MONGODB
      # --------------------------------------------------------
      - name: Deploy MongoDB
        shell: bash
        run: |
          echo "=========================================="
          echo "DEPLOYING MONGODB"
          echo "=========================================="

          kubectl apply \
            -f hospital-k8s/mongodb/pvc.yaml

          kubectl apply \
            -f hospital-k8s/mongodb/deployment.yaml

          kubectl apply \
            -f hospital-k8s/mongodb/service.yaml


      # --------------------------------------------------------
      # DEPLOY HOSPITAL API
      # --------------------------------------------------------
      - name: Deploy Hospital API
        shell: bash
        run: |
          echo "=========================================="
          echo "DEPLOYING HOSPITAL API"
          echo "=========================================="

          kubectl apply \
            -f hospital-k8s/hospital-api/configmap.yaml

          kubectl apply \
            -f hospital-k8s/hospital-api/deployment.yaml

          kubectl apply \
            -f hospital-k8s/hospital-api/service.yaml


      # --------------------------------------------------------
      # UPDATE HOSPITAL API IMAGE
      # --------------------------------------------------------
      - name: Update Hospital API image
        shell: bash
        run: |
          echo "=========================================="
          echo "UPDATING HOSPITAL API IMAGE"
          echo "=========================================="

          echo "Image:"
          echo "${IMAGE_NAME}:${IMAGE_TAG}"

          kubectl set image \
            deployment/hospital-api \
            hospital-api="${IMAGE_NAME}:${IMAGE_TAG}" \
            -n hospital


      # --------------------------------------------------------
      # WAIT FOR ROLLOUT
      # --------------------------------------------------------
      - name: Wait for Hospital API rollout
        shell: bash
        run: |
          echo "=========================================="
          echo "WAITING FOR ROLLOUT"
          echo "=========================================="

          kubectl rollout status \
            deployment/hospital-api \
            -n hospital \
            --timeout=180s


      # --------------------------------------------------------
      # VERIFY DEPLOYMENT
      # --------------------------------------------------------
      - name: Verify deployment
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "KUBERNETES DEPLOYMENT SUCCESSFUL"
          echo "=========================================="

          echo ""
          echo "Minikube:"
          minikube status

          echo ""
          echo "Kubernetes Nodes:"
          kubectl get nodes

          echo ""
          echo "Hospital Namespace:"
          kubectl get all -n hospital

          echo ""
          echo "Deployments:"
          kubectl get deployments -n hospital

          echo ""
          echo "Services:"
          kubectl get services -n hospital

          echo ""
          echo "Pods:"
          kubectl get pods -n hospital

          echo ""
          echo "Running Hospital API Image:"
          kubectl get deployment hospital-api \
            -n hospital \
            -o jsonpath="{.spec.template.spec.containers[0].image}"

          echo ""
          echo ""
          echo "Expected Image:"
          echo "${IMAGE_NAME}:${IMAGE_TAG}"

          echo ""
          echo "=========================================="
          echo "DEPLOYMENT VERIFICATION COMPLETE"
          echo "=========================================="