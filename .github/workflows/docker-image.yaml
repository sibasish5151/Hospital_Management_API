name: Hospital CI/CD

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: sibasish6976/testing-minikube-repo

jobs:

  # ============================================================
  # CI - BUILD AND PUSH DOCKER IMAGE
  # ============================================================
  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.image.outputs.tag }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate image tag
        id: image
        shell: bash
        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Building image: $IMAGE_NAME:${IMAGE_TAG}"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        shell: bash
        run: |
          docker build -t "$IMAGE_NAME:${{ steps.image.outputs.tag }}" .

      - name: Push Docker image
        shell: bash
        run: |
          docker push "$IMAGE_NAME:${{ steps.image.outputs.tag }}"


  # ============================================================
  # CD - DEPLOY TO LOCAL MINIKUBE
  # ============================================================
  deploy:
    needs: build-and-push

    runs-on: [self-hosted, minikube]

    env:
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}

    steps:

      # --------------------------------------------------------
      # CHECKOUT REPOSITORY
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # VERIFY MINIKUBE
      # --------------------------------------------------------
      - name: Verify Minikube
        shell: cmd
        run: |
          minikube status


      # --------------------------------------------------------
      # VERIFY KUBERNETES
      # --------------------------------------------------------
      - name: Verify Kubernetes
        shell: cmd
        run: |
          kubectl config use-context minikube
          kubectl get nodes


      # --------------------------------------------------------
      # DEPLOY MONGODB
      # --------------------------------------------------------
      - name: Deploy MongoDB
        shell: cmd
        run: |
          kubectl apply -f k8s/mongodb/pvc.yaml
          kubectl apply -f k8s/mongodb/deployment.yaml
          kubectl apply -f k8s/mongodb/service.yaml


      # --------------------------------------------------------
      # DEPLOY HOSPITAL API
      # --------------------------------------------------------
      - name: Deploy Hospital API
        shell: cmd
        run: |
          kubectl apply -f k8s/hospital-api/configmap.yaml
          kubectl apply -f k8s/hospital-api/deployment.yaml
          kubectl apply -f k8s/hospital-api/service.yaml


      # --------------------------------------------------------
      # UPDATE HOSPITAL API IMAGE
      # --------------------------------------------------------
      - name: Update Hospital API image
        shell: cmd
        run: |
          kubectl set image deployment/hospital-api hospital-api=%IMAGE_NAME%:%IMAGE_TAG% -n hospital


      # --------------------------------------------------------
      # WAIT FOR ROLLOUT
      # --------------------------------------------------------
      - name: Wait for deployment rollout
        shell: cmd
        run: |
          kubectl rollout status deployment/hospital-api -n hospital --timeout=180s


      # --------------------------------------------------------
      # VERIFY DEPLOYMENT
      # --------------------------------------------------------
      - name: Verify deployment
        shell: cmd
        run: |
          echo ==========================================
          echo KUBERNETES DEPLOYMENT SUCCESSFUL
          echo ==========================================

          echo.
          echo Minikube:
          minikube status

          echo.
          echo Kubernetes Nodes:
          kubectl get nodes

          echo.
          echo Hospital Namespace Pods:
          kubectl get pods -n hospital

          echo.
          echo Deployments:
          kubectl get deployments -n hospital

          echo.
          echo Services:
          kubectl get svc -n hospital

          echo.
          echo Running Hospital API Image:
          kubectl get deployment hospital-api -n hospital -o jsonpath="{.spec.template.spec.containers[0].image}"

          echo.
          echo.
          echo ==========================================
          echo DEPLOYMENT VERIFICATION COMPLETE
          echo ==========================================