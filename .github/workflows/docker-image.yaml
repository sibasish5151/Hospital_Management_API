name: Hospital CI/CD

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: sibasish6976/testing-minikube-repo

jobs:

  # ============================================================
  # CI - BUILD AND PUSH DOCKER IMAGE
  # ============================================================
  build-and-push:

    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.image.outputs.tag }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate image tag
        id: image
        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Building image: $IMAGE_NAME:${IMAGE_TAG}"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE_NAME:${{ steps.image.outputs.tag }} \
            .

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:${{ steps.image.outputs.tag }}


  # ============================================================
  # CD - DEPLOY TO LOCAL MINIKUBE
  # ============================================================
  deploy:

    needs: build-and-push

    runs-on: [self-hosted, minikube]

    env:
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}

    steps:

      # ----------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # VERIFY MINIKUBE
      # ----------------------------------------------------------
      - name: Verify Minikube
        shell: powershell -ExecutionPolicy Bypass
        run: |
          minikube status


      # ----------------------------------------------------------
      # VERIFY KUBERNETES
      # ----------------------------------------------------------
      - name: Verify Kubernetes
        shell: powershell -ExecutionPolicy Bypass
        run: |
          kubectl config use-context minikube
          kubectl get nodes


      # ----------------------------------------------------------
      # APPLY MONGODB MANIFESTS
      # ----------------------------------------------------------
      - name: Deploy MongoDB
        shell: powershell -ExecutionPolicy Bypass
        run: |
          kubectl apply -f k8s/mongodb/pvc.yaml
          kubectl apply -f k8s/mongodb/deployment.yaml
          kubectl apply -f k8s/mongodb/service.yaml


      # ----------------------------------------------------------
      # APPLY HOSPITAL API MANIFESTS
      # ----------------------------------------------------------
      - name: Deploy Hospital API
        shell: powershell -ExecutionPolicy Bypass
        run: |
          kubectl apply -f k8s/hospital-api/configmap.yaml
          kubectl apply -f k8s/hospital-api/deployment.yaml
          kubectl apply -f k8s/hospital-api/service.yaml


      # ----------------------------------------------------------
      # UPDATE API IMAGE
      # ----------------------------------------------------------
      - name: Update Hospital API image
        shell: powershell -ExecutionPolicy Bypass
        run: |
          kubectl set image deployment/hospital-api hospital-api=$env:IMAGE_NAME`:$env:IMAGE_TAG -n hospital


      # ----------------------------------------------------------
      # WAIT FOR ROLLOUT
      # ----------------------------------------------------------
      - name: Wait for deployment rollout
        shell: powershell -ExecutionPolicy Bypass
        run: |
          kubectl rollout status deployment/hospital-api -n hospital --timeout=180s


      # ----------------------------------------------------------
      # VERIFY FINAL DEPLOYMENT
      # ----------------------------------------------------------
      - name: Verify deployment
        shell: powershell -ExecutionPolicy Bypass
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host " KUBERNETES DEPLOYMENT SUCCESSFUL"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Minikube:"
          minikube status

          Write-Host ""
          Write-Host "Nodes:"
          kubectl get nodes

          Write-Host ""
          Write-Host "Pods:"
          kubectl get pods -n hospital

          Write-Host ""
          Write-Host "Deployments:"
          kubectl get deployments -n hospital

          Write-Host ""
          Write-Host "Services:"
          kubectl get svc -n hospital

          Write-Host ""
          Write-Host "Running Hospital API image:"
          kubectl get deployment hospital-api -n hospital -o jsonpath="{.spec.template.spec.containers[0].image}"

          Write-Host ""
          Write-Host ""
          Write-Host "=========================================="
          Write-Host " DEPLOYMENT VERIFICATION COMPLETE"
          Write-Host "=========================================="